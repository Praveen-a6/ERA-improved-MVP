version: '3.8'

services:
  # 1. Redis (Message Broker)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 2. FastAPI Backend
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock # Allows spawning sandbox containers
    env_file:
      - .env
    depends_on:
      - redis

  # 3. Celery Worker (Runs the heavy AI agents)
  worker:
    build: .
    command: celery -A api.worker.celery_app worker --loglevel=info --pool=solo
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock # Allows spawning sandbox containers
    env_file:
      - .env
    depends_on:
      - redis
      - api

  # 4. Flower (Observability for Celery)
  flower:
    image: mher/flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

  # 5. Streamlit Frontend
  ui:
    build: .
    command: streamlit run ui/main.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api